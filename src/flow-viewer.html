<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Mx navigation journey</title>
<style>:root{--bg:#e7edcf;--ink:#161811;--card:#f7f3e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px ui-monospace,SFMono-Regular,Menlo,monospace}header{position:sticky;top:0;z-index:2;display:flex;gap:18px;align-items:center;padding:12px 18px;background:#eef2dccc;border-bottom:2px solid var(--ink);backdrop-filter:blur(8px)}h1{font-size:16px;margin:0}#canvas{position:relative;min-width:100%;min-height:100vh;padding:70px}#edges{position:absolute;inset:0;overflow:visible;pointer-events:none}.node{position:absolute;width:220px;padding:8px;border:2px solid var(--ink);border-radius:12px;background:var(--card);box-shadow:5px 5px 0 #1b1d16}.node img{display:block;width:100%;height:390px;object-fit:contain;background:#fff;border:1px solid #777;border-radius:7px}.meta{display:flex;justify-content:space-between;gap:8px;margin-bottom:7px;font-weight:700}.timing{font-size:11px;color:#505445;margin-top:7px}.edge-label{font-size:11px;fill:var(--ink)}</style>
<header><h1>Mx navigation journey</h1><span id="summary"></span></header><main id="canvas"><svg id="edges"></svg></main>
<script>const states=__MX_FLOW_DATA__;const canvas=document.querySelector('#canvas'),svg=document.querySelector('#edges'),byName=new Map(states.map(s=>[s.name,s])),depth=new Map();function d(s,seen=new Set()){if(depth.has(s.name))return depth.get(s.name);if(!s.from||!byName.has(s.from)||seen.has(s.name))return 0;seen.add(s.name);const v=d(byName.get(s.from),seen)+1;depth.set(s.name,v);return v}states.forEach(s=>depth.set(s.name,d(s)));const rows=new Map();states.forEach(s=>{const x=depth.get(s.name)||0,row=rows.get(x)||[];row.push(s);rows.set(x,row)});let maxX=0,maxY=0;for(const [x,row] of rows)row.forEach((s,y)=>{const n=document.createElement('article');n.className='node';n.dataset.name=s.name;n.style.left=`${70+x*310}px`;n.style.top=`${70+y*500}px`;const meta=document.createElement('div');meta.className='meta';const name=document.createElement('span');name.textContent=s.name;const rev=document.createElement('span');rev.textContent=`r${s.revision}`;meta.append(name,rev);const img=document.createElement('img');img.src=s.screenshot_file;img.alt=s.name;const timing=document.createElement('div');timing.className='timing';timing.textContent=`transition ${s.transition_ms} ms · screenshot ${s.screenshot_ms} ms`;n.append(meta,img,timing);canvas.append(n);maxX=Math.max(maxX,310*x+360);maxY=Math.max(maxY,500*y+560)});canvas.style.width=maxX+'px';canvas.style.height=maxY+'px';svg.setAttribute('width',maxX);svg.setAttribute('height',maxY);const NS='http://www.w3.org/2000/svg';states.forEach(s=>{if(!s.from)return;const a=document.querySelector(`[data-name="${CSS.escape(s.from)}"]`),b=document.querySelector(`[data-name="${CSS.escape(s.name)}"]`);if(!a||!b)return;const x1=a.offsetLeft+a.offsetWidth,y1=a.offsetTop+a.offsetHeight/2,x2=b.offsetLeft,y2=b.offsetTop+b.offsetHeight/2,p=document.createElementNS(NS,'path');p.setAttribute('d',`M${x1},${y1} C${x1+70},${y1} ${x2-70},${y2} ${x2},${y2}`);p.setAttribute('fill','none');p.setAttribute('stroke','#25281f');p.setAttribute('stroke-width','2');svg.append(p);const t=document.createElementNS(NS,'text');t.setAttribute('x',(x1+x2)/2);t.setAttribute('y',(y1+y2)/2-7);t.setAttribute('text-anchor','middle');t.setAttribute('class','edge-label');t.textContent=s.transition||'route';svg.append(t)});document.querySelector('#summary').textContent=`${states.length} screens · ${states.reduce((n,s)=>n+s.total_ms,0)} ms captured`;</script></html>
