[package]
name = "mx"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Build, run, and inspect iOS simulator apps with a Rust CLI and MCP server for AI agents"
license = "MIT"
repository = "https://github.com/pol-cova/mx"
readme = "README.md"
keywords = ["ios", "simulator", "mcp", "automation", "cli"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "3.2", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt", "macros", "process", "time", "signal", "io-util"] }
schemars = "1"
tempfile = "3"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
objc2 = { version = "0.6", features = ["exception"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSError", "NSString", "NSObject", "NSUUID"] }
block2 = "0.6"
jpeg-encoder = "0.6"
png = "0.17"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
